version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: detailing_postgres
    environment:
      POSTGRES_DB: detailing_db
      POSTGRES_USER: detailing_user
      POSTGRES_PASSWORD: detailing_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - detailing_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: detailing_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@detailing.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - detailing_network
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: detailing_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://detailing_user:detailing_password@postgres:5432/detailing_db
      SECRET_KEY: your-secret-key-here
    volumes:
      - ./backend:/app
    networks:
      - detailing_network
    depends_on:
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  detailing_network:
    driver: bridge
